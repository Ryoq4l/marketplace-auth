spring:
  application:
    name: marketplace-auth
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:market_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          steam:
            client-id: steam-auth-client
            client-secret: ${STEAM_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/steam"
            scope: profile
            provider: steam
        provider:
          steam:
            authorization-uri: http://localhost:19000/authorize
            token-uri: http://steam-auth-proxy:19000/token
            user-info-uri: http://steam-auth-proxy:19000/userinfo
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

server:
  port: 8081
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false
        same-site: lax
        path: /
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
springdoc:
  api-docs:
    server-url: http://localhost:8080
  use-forward-headers: true
logging:
  level:
    org.springframework.security.oauth2: ${LOG_OAUTH2:INFO}
    org.springframework.security: ${LOG_SECURITY:INFO}
    org.springframework.web: INFO
    org.springframework.web.client.RestTemplate: INFO
    org.springframework.web.client.DefaultRestClient: INFO